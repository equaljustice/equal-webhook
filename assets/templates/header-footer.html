<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{TITLE}}</title>
  <style>
    /* @page margin is replaced at runtime in generatePDF() to match header/footer bands */
    @page {
      margin: 0;
      size: A4;
    }
    
    * { box-sizing: border-box; }
    
    body {
      font-family: 'Times New Roman', Times, serif;
      font-size: 12pt;
      line-height: 1.7;
      color: #1a1a1a;
      margin: 0;
      padding: 0;
    }
    
    .content {
      padding: 0 20px;
    }
    
    /* Typography */
    h1 {
      font-size: 18pt;
      font-weight: bold;
      margin: 20px 0 12px 0;
      color: #1a1a1a;
      font-family: 'Georgia', serif;
    }
    
    h2 {
      font-size: 15pt;
      font-weight: bold;
      margin: 20px 0 10px 0;
      color: #222;
      font-family: 'Georgia', serif;
    }
    
    h3 {
      font-size: 13pt;
      font-weight: bold;
      margin: 16px 0 8px 0;
      color: #333;
    }
    
    h4 {
      font-size: 12pt;
      font-weight: bold;
      margin: 14px 0 8px 0;
      color: #333;
    }
    
    h5 {
      font-size: 12pt;
      font-weight: bold;
      margin-top: 14px;
      margin-bottom: 5px;
      color: #1a1a1a;
    }
    
    h6 {
      font-size: 11pt;
      font-weight: normal;
      margin-top: 10px;
      margin-bottom: 8px;
      color: #333;
    }
    
    p {
      margin: 10px 0;
      text-align: justify;
      line-height: 1.7;
    }
    
    strong { font-weight: bold; }
    em { font-style: italic; color: #555; }
    u { text-decoration: underline; }
    
    p > strong:only-child,
    div > strong:only-child {
      font-size: 13pt;
      display: block;
      margin-top: 16px;
      margin-bottom: 10px;
      color: #1a1a1a;
    }
    
    ul, ol {
      margin: 10px 0;
      padding-left: 30px;
    }
    
    li {
      margin: 5px 0;
      line-height: 1.6;
    }
    
    .will-text {
      font-family: 'Times New Roman', Times, serif;
      font-size: 12pt;
      line-height: 1.9;
      white-space: pre-wrap;
      margin: 15px 0;
      padding: 12px 18px;
      border-left: 3px solid #22743a;
      background-color: #fafff8;
    }
    
    .legal-notice {
      font-family: 'Times New Roman', Times, serif;
      font-size: 12pt;
      line-height: 1.8;
      margin: 12px 0;
      text-align: justify;
    }
    
    table {
      width: 100%;
      border-collapse: collapse;
      margin: 12px 0;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 8px 12px;
      text-align: left;
      font-size: 11pt;
    }
    th { font-weight: bold; }
    
    .page-break { page-break-after: always; }
    
    .signature-block { margin-top: 40px; page-break-inside: avoid; }
    .signature-line {
      border-top: 1px solid #333;
      width: 250px;
      margin-top: 35px;
      padding-top: 5px;
      font-size: 11pt;
    }
    
    .disclaimer {
      margin-top: 25px;
      padding: 10px 12px;
      border: 1px solid #e0e0e0;
      background-color: #fafafa;
      font-size: 9pt;
      color: #777;
      line-height: 1.5;
    }
    
    /* End-of-document info */
    .document-end-info {
      margin-top: 28px;
      padding-top: 10px;
      font-size: 9pt;
      color: #999;
      text-align: left;
    }

    /*
     * PDF: gap between fixed header/footer (margin box) and flowing text.
     * pdf-content-safe is set for all PDFs from this template.
     */
    body.pdf-content-safe .content {
      padding-top: 4px;
      padding-bottom: 6px;
    }
    body.will-print.pdf-content-safe .content {
      padding-top: 4px;
      padding-bottom: 4px;
    }
  </style>
</head>
<body class="{{BODY_CLASS}}">
  <div class="content">
    {{CONTENT}}
    <div class="document-end-info">
      {{TIMESTAMP}}<br>
      equal@equaljustice.ai
    </div>
  </div>
</body>
</html>
